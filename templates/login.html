<!DOCTYPE html>
<html>
<head>
    <title>Login - CyberRisk Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #2471a3;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2471a3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
        }

        .register-link a {
            color: #2471a3;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>CyberRisk Assessment</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form method="POST" action="{{ url_for('login') }}">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            </div>


            <a href="{{ url_for('home') }}" class="home-link">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
