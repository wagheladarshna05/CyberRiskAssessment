<!DOCTYPE html>
<html>
<head>
    <title>Business Profile - CyberRisk Assessment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .navbar {
            background: #17202a;
            color: white;
            padding: 18px 40px;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            max-width: 650px;
            margin: 45px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2471a3;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2471a3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>CyberRisk Assessment</h2>
    </div>

    <div class="container">

        <div class="box">

            <h1>Business Profile</h1>

            <p class="subtitle">
                Enter your business information before starting the assessment.
            </p>

            <form method="POST" action="{{ url_for('business_profile') }}">

                <label for="business_name">
                    Business Name
                </label>

                <input
                    type="text"
                    id="business_name"
                    name="business_name"
                    required
                >


                <label for="business_type">
                    Business Type
                </label>

                <input
                    type="text"
                    id="business_type"
                    name="business_type"
                    placeholder="Example: IT Services"
                    required
                >


                <label for="employees">
                    Number of Employees
                </label>

                <input
                    type="number"
                    id="employees"
                    name="employees"
                    min="1"
                    required
                >


                <label for="digital_services">
                    Digital Services
                </label>

                <textarea
                    id="digital_services"
                    name="digital_services"
                    placeholder="Example: Website, Email, Online Payments"
                    required
                ></textarea>


                <label for="data_handled">
                    Data Handled
                </label>

                <textarea
                    id="data_handled"
                    name="data_handled"
                    placeholder="Example: Customer information, business records"
                    required
                ></textarea>


                <button type="submit">
                    Save Business Profile
                </button>

            </form>

            <a href="{{ url_for('dashboard') }}" class="back">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>
</html>
